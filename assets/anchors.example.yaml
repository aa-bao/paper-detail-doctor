# -*- coding: utf-8 -*-
# ============================================================================
# 锚点档案（anchors.yaml）—— 开题报告 ↔ 正文 一致性核对的"每篇论文数据"
#
# 本 skill 的**检查逻辑是通用的**（七类锚点 A1–A7 × 三层判定 L1/L2/L3）。
# 但"题眼是哪个词、点了哪些核心概念、引了哪些理论家、方法要素有哪些、
# 大纲里哪一章被并了节"—— 这些是**某一篇论文的数据**，不是工具的知识。
# 所以它们放在这里，由使用者（或宿主 agent 读一遍开题后）填写。
#
# 把它复制成下面任一个位置即可被自动找到（先命中者胜）：
#   1. 命令行  --anchors <file>
#   2. 环境变量 PDD_ANCHORS
#   3. <正文 docx 同目录>/.thesis-doctor/anchors.yaml
#   4. <包根>/assets/anchors.local.yaml          ← *.local.yaml 已被 .gitignore 忽略
#
# ⚠️ 未配置的锚点**一律产出「无法判定」交人工**，绝不静默判成"一致"。
#    这是刻意的：静默跳过会被读成"这一项没问题"。
#
# ⚠️ 值必须与文档里的**原文**逐字一致（中文标点也要一致），否则匹配不到，
#    会被报成「缺失/偏离」或「无法判定」。多数"误报"其实是这里填错了。
# ============================================================================

case: "（论文简称，仅用于报告抬头）"

# ----------------------------------------------------------------- A1 题目
# 题眼关键词：2–6 字的独特词（不要填"研究""分析"这类通用词）。
# 全部 token 都必须在开题与正文里双向出现，才算题目一致。
# 留空时会退化为"从开题全文里找《…》"，仍找不到就报「无法判定」。
A1_topic:
  tokens:
    - "（题眼 1）"
    # - "（题眼 2）"

# ------------------------------------------------------- A2 核心概念（L1+L2）
A2_concept:
  tokens:                      # 开题点名的核心概念 / 关键词
    - "（核心概念 1）"
  thesis_heading: "（正文里界定这些概念的那一节标题片段）"

# -------------------------------------------------- A3 理论基础与学者（L1+L2）
A3_theory:
  tokens:                      # 理论名或学者名
    - "（理论/学者 1）"
  thesis_heading: "（正文里讲理论的那一节标题片段）"

# --------------------------------------------------- A4 研究方法要素（L1 数字）
A4_method:
  tokens:                      # 方法 / 对象 / 地点关键词
    - "访谈"
    - "观察"
  plan_anchor: "计划访谈"       # 开题里样本量那句的锚词，如「计划访谈 30—40 人」
  actual_anchor: "完成访谈"     # 正文里样本量那句的锚词，如「完成访谈 15 人」
                               # 两者留空则用默认值；措辞不同的课题请改写这里
                               # （抽不到数字时报「无法判定」，不会瞎判）

# ------------------------------------------------------- A5 章节大纲（L3 结构）
A5_outline:
  # ① 双方应同名出现的结构性标签 -> 作为"一致"证据。留空则跳过这一项。
  expect_passed:
    - "（结构标签，如四重逻辑的名字）"
  # 上面这些标签在报告里显示成什么（可选；不给则显示"大纲同名标签一致"）
  expect_passed_label: "（如：四重逻辑一致）"

  # ② 改动：开题里有独立一级章、正文把它并成了节
  merged_chapter: "（开题里有、正文里降为节的章名）"
  merged_target: "（正文里并入到的那一节标题片段）"

  # ③ 偏离：正文新增了小节，而开题大纲里没有
  extra_tokens:
    - "（新增小节的题眼）"
  chapter_heading: "（新增小节所在的正文一级章标题片段）"

  # ④ 缺失：开题大纲里有这个条目，正文无对应标题
  missing_section: "（开题大纲里有、正文没落地的条目名）"
  missing_fallback:
    - "（报到「缺失」时，给正文哪一节作为最相近位置）"

# ------------------------------------------------------ A6 预期结论（L2 语义）
A6_conclusion:
  proposal_token: "（开题里核心论断那句话的锚词）"
  thesis_heading: "（正文结论/核心论断所在那节的标题片段）"

# ------------------------------------------------- A7 文献承诺（通用，无需配置）
# 脚本自己抓「不少于 N 条」并与正文参考文献条数比，通常不用填。
A7_refs: {}
